<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Projeto - HTTP</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #ffe4f0, #e5d9ff);
            color: #4a3b52;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 650px;
            background: rgba(255, 255, 255, 0.95);
            padding: 40px;
            border-radius: 25px;
            box-shadow: 0 10px 30px rgba(100, 70, 120, 0.2);
            text-align: center;
        }

        .icone {
            font-size: 55px;
            margin-bottom: 15px;
        }

        h1 {
            color: #9b5de5;
            font-size: 32px;
            margin-bottom: 10px;
        }

        .subtitulo {
            color: #777;
            margin-bottom: 30px;
            font-size: 16px;
        }

        .informacoes {
            display: flex;
            flex-direction: column;
            gap: 15px;
            text-align: left;
        }

        .card {
            background: #fff0f7;
            padding: 18px 20px;
            border-radius: 15px;
            border-left: 5px solid #f284c6;
            transition: 0.3s;
        }

        .card:hover {
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(155, 93, 229, 0.15);
        }

        .card strong {
            color: #9b5de5;
        }

        .tema {
            margin-top: 25px;
            padding: 20px;
            border-radius: 18px;
            background: linear-gradient(135deg, #d9c2ff, #ffc8e3);
        }

        .tema h2 {
            color: #6d3ca5;
            margin-bottom: 8px;
        }

        .tema p {
            color: #55405f;
        }

        footer {
            margin-top: 30px;
            font-size: 13px;
            color: #999;
        }
    </style>
</head>

<body>

    <main class="container">

        <div class="icone">🌸💻</div>

        <h1>Meu Projeto da Disciplina</h1>

        <p class="subtitulo">
            Administração de Sistemas Proprietários
        </p>

        <section class="informacoes">

            <div class="card">
                <strong>👩‍💻 Aluna:</strong> Viviane
            </div>

            <div class="card">
                <strong>👩‍💻 Aluna:</strong> Maria Heloyza
            </div>

            <div class="card">
                <strong>📚 Disciplina:</strong>
                Administração de Sistemas Proprietários
            </div>

        </section>

        <section class="tema">
            <h2>🌐 Tema do Projeto</h2>
            <p>
                <strong>HTTP</strong> — HyperText Transfer Protocol
            </p>
        </section>

        <footer>
            ✨ Projeto acadêmico ✨
        </footer>

    </main>

</body>
</html>
